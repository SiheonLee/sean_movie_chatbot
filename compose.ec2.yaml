services:
  api:
    image: ${CINEBOT_IMAGE:-seandev27/cinebot:d6-cbd7a10}

    env_file:
      - .env

    environment:
      LLM_PROVIDER: openai
      GRAPH_NATIVE_STRUCTURED_OUTPUT: "true"

      # 준비된 검색 아티팩트는 EC2 호스트에서 읽기 전용으로 마운트한다.
      MOVIES_FILE: /app/catalog/movies.json
      ENRICHED_FILE: /app/catalog/enriched.json
      # Chroma 1.5.x는 조회만 해도 SQLite 런타임 파일을 쓸 수 있어 원본을 직접
      # 열 수 없다. 읽기 전용 seed를 tmpfs에 복사하고 그 복사본만 연다.
      CHROMA_DIR: /app/chroma_runtime
      LANGSMITH_TRACING: "false"

      # checkpoint와 요청 사용량은 같은 영구 볼륨에서 보존한다.
      CHECKPOINTER: sqlite
      CHECKPOINT_DB: /app/state/graph_checkpoints.sqlite
      RATE_LIMIT_DB: /app/state/rate_limits.sqlite
      DAILY_QUESTION_LIMIT: "${DAILY_QUESTION_LIMIT:-30}"
      SESSION_QUESTION_LIMIT: "${SESSION_QUESTION_LIMIT:-12}"
      MAX_CONCURRENT_REQUESTS: "${MAX_CONCURRENT_REQUESTS:-2}"

    command:
      - /bin/sh
      - -c
      - |
        cp -a /app/chroma_seed/. /app/chroma_runtime/
        exec uvicorn rag.api:app --host=0.0.0.0 --port=8000

    volumes:
      - type: bind
        source: ./data/movies.json
        target: /app/catalog/movies.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/enriched.json
        target: /app/catalog/enriched.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./chroma_db
        target: /app/chroma_seed
        read_only: true
        bind:
          create_host_path: false
      - checkpoint_data:/app/state

    # 원본 Chroma는 계속 읽기 전용으로 보존하고 런타임 쓰기는 메모리 복사본에만 한다.
    tmpfs:
      - /app/chroma_runtime:size=64m,mode=0755

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - backend

    restart: unless-stopped

  ui:
    image: ${CINEBOT_IMAGE:-seandev27/cinebot:d6-cbd7a10}

    environment:
      # UI만 backend에 연결해 외부에 공개되지 않은 API를 호출한다.
      RAG_API_URL: http://api:8000
      CINEBOT_PASSCODE: ${CINEBOT_PASSCODE:?set CINEBOT_PASSCODE in .env}
      DAILY_QUESTION_LIMIT: "${DAILY_QUESTION_LIMIT:-30}"
      SESSION_QUESTION_LIMIT: "${SESSION_QUESTION_LIMIT:-12}"
      CINEBOT_HISTORY_DIR: /app/user_data/conversations
      CINEBOT_WATCHLIST_DIR: /app/user_data/watchlist

    command:
      - streamlit
      - run
      - ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501

    depends_on:
      api:
        condition: service_healthy

    volumes:
      - user_data:/app/user_data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

    networks:
      - frontend
      - backend

    restart: unless-stopped

  caddy:
    image: caddy:2.11.4-alpine

    depends_on:
      ui:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      # 인증서와 개인 키가 들어가는 /data는 반드시 재시작 뒤에도 보존한다.
      - caddy_data:/data
      - caddy_config:/config

    healthcheck:
      test:
        - CMD
        - caddy
        - validate
        - --config
        - /etc/caddy/Caddyfile
        - --adapter
        - caddyfile
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - frontend

    restart: unless-stopped

networks:
  frontend:
  backend:

volumes:
  checkpoint_data:
  user_data:
  caddy_data:
  caddy_config:
