services:
  api:
    build:
      context: .
    image: cinebot:local

    env_file:
      - .env

    environment:
      LLM_PROVIDER: openai
      GRAPH_NATIVE_STRUCTURED_OUTPUT: "true"

      # 준비된 런타임 아티팩트. 컨테이너에서는 읽기만 한다.
      MOVIES_FILE: /app/catalog/movies.json
      ENRICHED_FILE: /app/catalog/enriched.json
      CHROMA_DIR: /app/chroma_db

      # API 키 없이 먼저 실행
      LANGSMITH_TRACING: "false"

      # 컨테이너 재시작 후에도 대화 체크포인트 유지
      CHECKPOINTER: sqlite
      CHECKPOINT_DB: /app/state/graph_checkpoints.sqlite

      # 익명 사용자별 비용 상한과 대화 길이, 동시에 진행할 외부 호출 수
      RATE_LIMIT_DB: /app/state/rate_limits.sqlite
      DAILY_QUESTION_LIMIT: "${DAILY_QUESTION_LIMIT:-30}"
      SESSION_QUESTION_LIMIT: "${SESSION_QUESTION_LIMIT:-12}"
      MAX_CONCURRENT_REQUESTS: "${MAX_CONCURRENT_REQUESTS:-2}"

    command:
      - uvicorn
      - rag.api:app
      - --host=0.0.0.0
      - --port=8000

    volumes:
      - type: bind
        source: ./data/movies.json
        target: /app/catalog/movies.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/enriched.json
        target: /app/catalog/enriched.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./chroma_db
        target: /app/chroma_db
        read_only: true
        bind:
          create_host_path: false
      - checkpoint_data:/app/state

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped

  ui:
    build:
      context: .
    image: cinebot:local

    environment:
      # Compose 네트워크에서는 서비스 이름이 호스트 이름
      RAG_API_URL: http://api:8000

      # 배포용 Compose는 잠금 없이 뜨지 않게 한다. 로컬 단독 실행은 기존처럼
      # 빈 값도 허용하지만, Compose에는 반드시 .env 값을 넣어야 한다.
      CINEBOT_PASSCODE: ${CINEBOT_PASSCODE:?set CINEBOT_PASSCODE in .env}
      DAILY_QUESTION_LIMIT: "${DAILY_QUESTION_LIMIT:-30}"
      SESSION_QUESTION_LIMIT: "${SESSION_QUESTION_LIMIT:-12}"

      # 영화 아티팩트와 섞지 않는 UI 전용 사용자 데이터 경로
      CINEBOT_HISTORY_DIR: /app/user_data/conversations
      CINEBOT_WATCHLIST_DIR: /app/user_data/watchlist

    command:
      - streamlit
      - run
      - ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501

    ports:
      - "127.0.0.1:8501:8501"

    depends_on:
      api:
        condition: service_healthy

    volumes:
      - user_data:/app/user_data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

    restart: unless-stopped

volumes:
  checkpoint_data:
  user_data:
