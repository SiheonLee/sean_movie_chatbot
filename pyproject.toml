[project]
name = "rag-project-langgraph"
version = "0.1.0"
description = "영화 정보 RAG 챗봇 — LangGraph StateGraph 버전"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.2.2",
    "langchain>=1.3.11",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-anthropic>=1.3.0",
    "langchain-google-genai>=4.2.5",
    "langchain-ollama>=0.3.0",
    "langchain-huggingface>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langsmith>=0.9.1",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "streamlit>=1.41.0",
    "uvicorn>=0.32.0",
    "langgraph>=0.2.0",
    # sqlite 체크포인터(영속 멀티턴 메모리)를 쓸 때만 필요:
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-tavily>=0.2.18",
    "langchain-openai>=1.4.1",
]

[project.optional-dependencies]
# 로컬 HuggingFace LLM 파이프라인을 사용할 때만 설치한다.
local-hf = [
    "sentence-transformers>=5.2.0",
    "transformers>=5.0.0",
]
